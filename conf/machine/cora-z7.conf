#@TYPE: Machine
#@NAME: cora-z7
#@DESCRIPTION: Baseline support for cora-z7

# Xilinx documentation on machine layers: https://github.com/Xilinx/meta-xilinx/blob/rel-v2024.2/meta-xilinx-core/conf/machine/README

#### Preamble
MACHINEOVERRIDES =. "${@['', 'cora-z7:']['cora-z7' != '${MACHINE}']}"
#### Regular settings follow

require conf/machine/zynq-generic.conf

IMAGE_FSTYPES += "wic"
WKS_FILES = "xilinx-default-sd.wks"

UBOOT_ELF = "u-boot"

EXTRA_IMAGEDEPENDS += " \
		u-boot-xlnx-uenv \
        external-hdf \
		"

IMAGE_BOOT_FILES += " \
		boot.bin \
		uEnv.txt \
		"

PREFERRED_PROVIDER_u-boot = "u-boot-xlnx-uenv"
XILINX_XSCT_VERSION = "2024.2"
XILINX_WITH_ESW = "xsct"

# Add pseudodesign linux SD image
# TODO: consider moving this to the distro configuration
# IMAGE_CLASSES:append = " image-types-pseudo-design"
# IMAGE_FSTYPES:append = " wic.pseudo-design-sd"
# WKS_FILES = "pseudo-design-linux-sdcard.wks"
# IMAGE_BOOT_FILES = "boot.scr boot.bin"

# Add pseudodesign linux specific recipes
# TODO: consider moving this to the distro configuration
#IMAGE_INSTALL:append = " pd-data-partition"

#### No additional settings should be after the Postamble
#### Postamble
PACKAGE_EXTRA_ARCHS:append = "${@['', ' cora-z7']['cora-z7' != "${MACHINE}"]}"